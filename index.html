<!DOCTYPE html>
<!--
  Klárt (Vaskingen) · Cleaning price calculator, private customers / B2C
  Version 3.6.0 — 2026-09-23

  Time-based pricing: price = wage cost / (1 - gross margin), never below 55 %.
  Everything is priced on expected minutes - cleaning, toilets, deep cleaning,
  bed linen, pets, extra tasks, windows and driving. Tunnel tolls are sold at
  the same margin on top of the actual toll. Evening/weekend, urgent and
  one-off are added to the wage as extra time, so the margin is unchanged.
  The final price is always rounded UP to the nearest DKK 50 incl. VAT, and
  never below the standard price for the smallest size.

  Size steps, times, kitchen tasks and window tiers follow the price sheet
  "Home Cleaning Price List" (2026-09-22). Deep cleaning is set to 480 minutes.
  EVERY price here is indicative: the figure can move if the job turns out to
  be more demanding, and deep cleaning and commercial jobs require an on-site
  visit before a firm quote. Times for toilets, bed linen and pets are still
  proposals.
  Single self-contained file: no build step, no dependencies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klárt · Prisberegner for privatkunder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A3A; --ink-soft:#4A6674; --ink-faint:#7D949E;
  --canvas:#E7EDEF; --surface:#FFFFFF; --surface-2:#F4F7F8;
  --line:#C7D5DB; --line-soft:#DDE6EA;
  --teal:#0F7D8C; --teal-deep:#0A5C68;
  --amber:#9C6206; --amber-bg:#FDF3E0;
  --red:#A03028; --red-bg:#FBECEA;
  --green:#1B6E47; --green-bg:#E8F3ED;
  --sans:'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.mast{background:var(--ink);color:#EAF2F4;padding:18px 24px;position:sticky;top:0;z-index:40}
.mast-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
.mast h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-0.01em}
.mast .sub{color:#8FB0BB;font-size:13px}
.mast-tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#EAF2F4;
  border-radius:5px;padding:5px 11px;cursor:pointer;font-size:13px}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn.on{background:var(--teal);border-color:var(--teal)}
.langs{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:5px;overflow:hidden}
.langs button{background:transparent;border:0;border-right:1px solid rgba(255,255,255,.16);
  color:#B9CFD6;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:500;letter-spacing:.03em}
.langs button:last-child{border-right:0}
.langs button:hover{background:rgba(255,255,255,.1);color:#EAF2F4}
.langs button.on{background:#EAF2F4;color:var(--ink);font-weight:600}

.shell{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;padding:20px 24px 60px;align-items:start}
@media(max-width:1000px){.shell{grid-template-columns:1fr}}

.rail{position:sticky;top:92px;max-height:calc(100vh - 112px);overflow-y:auto;padding-right:4px}
@media(max-width:1000px){.rail{position:static;max-height:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:7px;margin-bottom:12px;overflow:hidden}
.panel.edit{border-color:var(--teal)}
.panel > h2{margin:0;font-size:13.5px;font-weight:600;padding:10px 13px;background:var(--surface-2);
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;gap:8px}
.panel.edit > h2{background:#EAF5F6}
.panel > h2 .chev{color:var(--ink-faint);font-size:11px;transition:transform .15s;flex:none}
.panel.closed > h2 .chev{transform:rotate(-90deg)}
.panel.closed .pbody{display:none}
.pbody{padding:10px 13px 12px}
.note{font-size:12px;color:var(--ink-soft);margin:0 0 8px;line-height:1.45}
.note a{color:var(--teal-deep)}
.locknote{font-size:11.5px;color:var(--ink-faint);margin:0 0 10px;line-height:1.4;
  padding:7px 9px;background:var(--surface-2);border-radius:5px;border:1px solid var(--line-soft)}

.plist{width:100%;border-collapse:collapse;font-size:12.5px}
.plist td{padding:4px 0;border-bottom:1px solid var(--line-soft);color:var(--ink-soft);vertical-align:top}
.plist td:last-child{text-align:right;font-weight:600;color:var(--ink);white-space:nowrap;padding-left:10px}
.plist tr:last-child td{border-bottom:0}
.plist .sm{display:block;font-size:11.5px;color:var(--ink-faint)}

.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.row label{flex:1;font-size:13px;color:var(--ink-soft)}
.row input[type=number]{width:86px;padding:5px 7px;border:1px solid var(--line);border-radius:4px;
  background:var(--surface);text-align:right}
input.flag{background:#FFF8E6;border-color:#E3C067;font-weight:600}
textarea{width:100%;min-height:74px;padding:7px 8px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface);resize:vertical;font-size:12.5px;line-height:1.4}
.btnrow{display:flex;gap:7px;margin-top:7px}
.sbtn{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 9px;
  cursor:pointer;font-size:12.5px;color:var(--ink)}
.sbtn:hover{border-color:var(--teal);color:var(--teal-deep)}
.msg{font-size:11.5px;margin-top:7px;min-height:1em;color:var(--teal-deep)}
.msg.bad{color:var(--red)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:16px}
.card > h2{margin:0;font-size:14px;font-weight:600;padding:11px 15px;background:var(--surface-2);
  border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.card > h2 span.s{font-weight:400;font-size:12.5px;color:var(--ink-faint)}

.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:16px 15px}
.inputs .span2{grid-column:span 2}
@media(max-width:520px){.inputs .span2{grid-column:span 1}}
.fld label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.fld input[type=number]{text-align:right}
.fld .u{font-size:11.5px;color:var(--ink-faint);margin-top:4px;display:block;min-height:1.1em;line-height:1.3}
.fld .u.est{color:var(--amber)}
.fld.tick{display:flex;align-items:center;gap:8px;padding-top:18px}
.fld.tick input{width:17px;height:17px;accent-color:var(--teal);padding:0;flex:none}
.fld.tick label{margin:0;font-size:13px;color:var(--ink)}
.fld.hide{display:none}
.fld.dim{opacity:.55}
.fld.dim input,.fld.dim select{background:var(--surface-2);cursor:not-allowed}

.result{display:grid;grid-template-columns:minmax(230px,290px) minmax(0,1fr);border-top:1px solid var(--line)}
@media(max-width:760px){.result{grid-template-columns:1fr}}
.bigbox{background:var(--ink);color:#EAF2F4;padding:22px 20px;display:flex;flex-direction:column;justify-content:center}
.bigbox .lbl{font-size:12px;color:#8FB0BB}
.bigbox .amt{font-size:44px;font-weight:700;letter-spacing:-0.03em;line-height:1.05;margin:2px 0 1px}
.bigbox .amt small{font-size:18px;font-weight:500;margin-left:5px;color:#B9CFD6}
.bigbox .alt{font-size:13px;color:#8FB0BB;margin-top:7px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line-soft)}
.kpi{background:var(--surface);padding:14px 15px}
.kpi .k{font-size:11.5px;color:var(--ink-soft)}
.kpi .v{font-size:20px;font-weight:600;letter-spacing:-0.02em;line-height:1.25}
.kpi .v small{font-size:12px;font-weight:400;color:var(--ink-faint);margin-left:3px}
.kpi .v.sm{font-size:14.5px}
.kpi .v.g{color:var(--green)} .kpi .v.y{color:var(--amber)} .kpi .v.r{color:var(--red)}

.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;padding:18px 15px}
.bd h4{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.bd dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:13.5px}
.bd dt{color:var(--ink-soft)}
.bd dd{margin:0;text-align:right}
.bd dd.neg{color:var(--green)}
.bd .tot{display:contents}
.bd .tot dt,.bd .tot dd{font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;color:var(--ink);font-size:15px}
.bar{height:10px;background:#E3EBEE;border-radius:5px;overflow:hidden;margin:14px 0 6px;display:flex}
.bar span{display:block;height:100%}
.bar .cost{background:var(--ink-soft)} .bar .gm{background:var(--teal)}
.leg{font-size:12px;color:var(--ink-soft);display:flex;gap:16px;flex-wrap:wrap}
.leg b{font-weight:600;color:var(--ink)}
.incl{padding:11px 15px;border-top:1px solid var(--line-soft);background:var(--surface-2);font-size:12.5px;color:var(--ink-soft)}
.flagbox{margin:0 15px 16px;padding:10px 12px;background:var(--amber-bg);border:1px solid #EBD5A8;
  border-radius:6px;font-size:12.5px;color:var(--amber);display:none}
.flagbox.on{display:block}

.tilegroup{padding:4px 15px 14px}
.tg-title{margin:0 0 8px;font-size:12px;color:var(--ink-soft);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);
  cursor:pointer;text-align:left;font-family:inherit}
.tile:hover{border-color:var(--teal)}
.tile .tn{display:block;font-weight:600;font-size:13.5px;color:var(--ink)}
.tile .tp{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px;letter-spacing:.02em}
.tile.sel{background:var(--ink);border-color:var(--ink)}
.tile.sel .tn{color:#EAF2F4}
.tile.sel .tp{color:#9DBAC3;text-transform:uppercase;font-weight:600}

.foot{color:var(--ink-soft);font-size:12.5px;max-width:820px;padding:0 2px}
.foot ul{margin:6px 0 0;padding-left:18px}
.foot li{margin-bottom:4px}
.foot a{color:var(--teal-deep)}

@media print{
  .mast{position:static}.mast-tools,.foot{display:none}
  .shell{grid-template-columns:1fr;padding:0}body{background:#fff}
  .rail{position:static;max-height:none}
  .bigbox{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .bigbox .lbl,.bigbox .alt{color:var(--ink-soft)}
}
/* ---- password gate ---- */
#gate{position:fixed;inset:0;z-index:100;background:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:24px}
#gate.off{display:none}
body.locked{overflow:hidden}
.gatebox{width:100%;max-width:330px;text-align:center;color:#EAF2F4}
.gatebox .mark{width:46px;height:46px;margin:0 auto 18px;border:2px solid #3F6273;
  border-radius:11px;display:flex;align-items:center;justify-content:center}
.gatebox h2{font-size:23px;font-weight:600;margin:0 0 4px;letter-spacing:-0.015em}
.gatebox p{font-size:13px;color:#8FB0BB;margin:0 0 24px}
#gatePw{width:100%;padding:11px 13px;border:1px solid #3A5A6A;border-radius:6px;
  background:#12313F;color:#EAF2F4;text-align:center;letter-spacing:.14em}
#gatePw::placeholder{color:#6B8A98;letter-spacing:normal}
#gatePw:focus{border-color:var(--teal)}
#gateBtn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:6px;
  background:var(--teal);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
#gateBtn:hover{background:#12909F}
#gateErr{min-height:1.3em;margin-top:13px;font-size:12.5px;color:#E0705F}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  60%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
@media print{#gate{display:none!important}}

@media(prefers-reduced-motion:reduce){*{transition:none!important}.shake{animation:none}}
/* ---- time-based model ---- */
.fld .u.winhint{margin-top:-6px;font-size:11.5px}
.plist tr.thead td{font-size:11px;color:var(--ink-faint);font-weight:500;padding-bottom:2px}
.plist td.num{text-align:right;font-weight:600;color:var(--ink);white-space:nowrap;padding-left:10px}
.note.hintbad{color:var(--red);margin:0 0 6px;min-height:0}
.note.hintbad:empty{display:none}
.capnote{color:var(--amber)}
.row .unit{font-size:12px;color:var(--ink-faint);min-width:22px}
.fld.tick{flex-wrap:wrap}
.fld.tick .u{display:block;width:100%;margin:2px 0 0 25px}
.tilegroup.tasks{padding-top:2px}
.tg-note{font-weight:400;color:var(--ink-faint);margin-left:6px}
.exhead,.exrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 96px 34px;gap:8px;align-items:center}
.exhead{font-size:11.5px;color:var(--ink-faint);margin-bottom:5px}
.exhead span:nth-child(2),.exhead span:nth-child(3){text-align:right}
.exrow{margin-bottom:8px}
.exrow input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.exrow .exMin{text-align:right}
.exrow .exFixed{font-weight:600;font-size:13.5px;padding:8px 2px}
.exrow .exPrice{text-align:right;font-weight:600;font-size:13.5px}
.exrow .exDel{height:35px;border:1px solid var(--line);background:var(--surface);border-radius:5px;
  cursor:pointer;color:var(--ink-faint);font-size:17px;line-height:1}
.exrow .exDel:hover{color:var(--red);border-color:var(--red)}
.sbtn.addbtn{flex:none;width:auto;padding:7px 12px;margin-top:2px}
@media(max-width:560px){.exhead,.exrow{grid-template-columns:minmax(0,1fr) 72px 74px 30px}}
</style>
</head>
<body class="locked">

<div id="gate">
  <div class="gatebox">
    <div class="mark">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8FB0BB" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2>Klárt</h2>
    <p>Price calculator, private customers</p>
    <input type="password" id="gatePw" placeholder="Password" autocomplete="current-password"
           autocapitalize="off" spellcheck="false">
    <button id="gateBtn" type="button">Unlock</button>
    <div id="gateErr" role="alert"></div>
  </div>
</div>

<header class="mast">
  <div class="mast-top">
    <h1 data-t="appTitle"></h1>
    <span class="sub" id="vatlbl"></span>
    <div class="mast-tools">
      <div class="langs" id="langs">
        <button data-lang="da">DA</button>
        <button data-lang="en" class="on">EN</button>
        <button data-lang="fo">FO</button>
      </div>
      <button class="tbtn" id="vatBtn"></button>
      <button class="tbtn" id="copyBtn"></button>
      <button class="tbtn" id="saveBtn"></button>
      <label class="tbtn" style="margin:0"><span data-t="load"></span><input type="file" id="loadInp" accept=".json" hidden></label>
      <button class="tbtn" id="printBtn"></button>
    </div>
  </div>
</header>


<div class="shell">

  <aside class="rail">
    <p class="locknote" id="lockNote"></p>

    <section class="panel">
      <h2><span data-t="pBase"></span><span class="chev">▾</span></h2>
      <div class="pbody">
        <p class="note" id="baseNote"></p>
        <table class="plist" id="tBase"></table>
      </div>
    </section>

    <section class="panel">
      <h2><span data-t="pTunnel"></span><span class="chev">▾</span></h2>
      <div class="pbody">
        <p class="note" data-t="tunnelNote"></p>
        <table class="plist" id="tTunnels"></table>
      </div>
    </section>

    <section class="panel edit">
      <h2><span data-t="pRate"></span><span class="chev">▾</span></h2>
      <div class="pbody">
        <div class="row"><label data-t="wageL"></label><input type="number" id="s_wage" value="220" min="0"></div>
        <div class="row"><label data-t="dgL"></label><input type="number" id="s_dg" value="55" min="55" max="95"><span class="unit">%</span></div>
        <p class="note hintbad" id="markupHint"></p>
        <p class="note" style="margin:6px 0 0" id="rateNote"></p>
      </div>
    </section>


    <section class="panel edit">
      <h2><span data-t="pTimes"></span><span class="chev">▾</span></h2>
      <div class="pbody">
        <p class="note" data-t="timesNote"></p>
        <div class="row"><label data-t="tToilet"></label><input type="number" id="s_mToilet" value="15" min="0" class="flag"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="tDeep"></label><input type="number" id="s_mDeep" value="480" min="0" class="flag"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="tLinen"></label><input type="number" id="s_mLinen" value="10" min="0" class="flag"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="tPets"></label><input type="number" id="s_mPets" value="40" min="0" class="flag"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="exFridge"></label><input type="number" id="s_mFridge" value="40" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="exFreezer"></label><input type="number" id="s_mFreezer" value="40" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="exFridgeFreezer"></label><input type="number" id="s_mFridgeFreezer" value="75" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="exDefrost"></label><input type="number" id="s_mDefrost" value="105" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="exOven"></label><input type="number" id="s_mOven" value="40" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="exCabinets"></label><input type="number" id="s_mCabinets" value="75" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label data-t="exDeep"></label><input type="number" id="s_mExtraDeep" value="180" min="0"><span class="unit" data-t="minShort"></span></div>
      </div>
    </section>

    <section class="panel edit">
      <h2><span data-t="pWin"></span><span class="chev">▾</span></h2>
      <div class="pbody">
        <p class="note" data-t="winNote"></p>
        <div class="row"><label id="lbl_s_w5"></label><input type="number" id="s_w5" value="25" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label id="lbl_s_w10"></label><input type="number" id="s_w10" value="39" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label id="lbl_s_w15"></label><input type="number" id="s_w15" value="54" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label id="lbl_s_w20"></label><input type="number" id="s_w20" value="69" min="0"><span class="unit" data-t="minShort"></span></div>
        <div class="row"><label id="lbl_s_w30"></label><input type="number" id="s_w30" value="98" min="0"><span class="unit" data-t="minShort"></span></div>
      </div>
    </section>

    <section class="panel edit">
      <h2><span data-t="pFees"></span><span class="chev">▾</span></h2>
      <div class="pbody">
        <p class="note" data-t="feesNote"></p>
        <div class="row"><label data-t="offHoursL"></label><input type="number" id="s_offhours" value="15" min="0" class="flag"><span class="unit">%</span></div>
        <div class="row"><label data-t="urgentL"></label><input type="number" id="s_urgent" value="25" min="0" class="flag"><span class="unit">%</span></div>
        <div class="row"><label data-t="oneOffL"></label><input type="number" id="s_oneoff" value="15" min="0"><span class="unit">%</span></div>
      </div>
    </section>

    <section class="panel edit">
      <h2><span data-t="pDrive"></span><span class="chev">▾</span></h2>
      <div class="pbody">
        <p class="note" id="driveNote"></p>

<script>
/* ==================== password gate ==================== */
var PW_HASH = "76e829d2928c41954ecbc03af0000ee06386905ac942fd5f51c845b00ab439d2";

function sha256(str){
  function rr(n,x){ return (x>>>n)|(x<<(32-n)); }
  var K=[],H=[],primes=[],i=2,j,s;
  while(primes.length<64){
    for(j=2;j*j<=i;j++) if(i%j===0) break;
    if(j*j>i) primes.push(i);
    i++;
  }
  for(i=0;i<64;i++) K[i]=(Math.pow(primes[i],1/3)%1*Math.pow(2,32))|0;
  for(i=0;i<8;i++)  H[i]=(Math.pow(primes[i],1/2)%1*Math.pow(2,32))|0;

  var bytes=[],k;
  for(i=0;i<str.length;i++){
    k=str.charCodeAt(i);
    if(k<128) bytes.push(k);
    else if(k<2048) bytes.push(192|(k>>6),128|(k&63));
    else bytes.push(224|(k>>12),128|((k>>6)&63),128|(k&63));
  }
  var bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(i=7;i>=0;i--) bytes.push((i<4?Math.floor(bitLen/Math.pow(2,i*8)):0)&255);

  var w=new Array(64),a,b,c,d,e,f,g,h,t1,t2,S0,S1,ch,maj,blk;
  for(blk=0;blk<bytes.length;blk+=64){
    for(i=0;i<16;i++)
      w[i]=(bytes[blk+i*4]<<24)|(bytes[blk+i*4+1]<<16)|(bytes[blk+i*4+2]<<8)|bytes[blk+i*4+3];
    for(i=16;i<64;i++){
      s=w[i-15]; S0=rr(7,s)^rr(18,s)^(s>>>3);
      s=w[i-2];  S1=rr(17,s)^rr(19,s)^(s>>>10);
      w[i]=(w[i-16]+S0+w[i-7]+S1)|0;
    }
    a=H[0];b=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
    for(i=0;i<64;i++){
      S1=rr(6,e)^rr(11,e)^rr(25,e);
      ch=(e&f)^(~e&g);
      t1=(h+S1+ch+K[i]+w[i])|0;
      S0=rr(2,a)^rr(13,a)^rr(22,a);
      maj=(a&b)^(a&c)^(b&c);
      t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out="";
  for(i=0;i<8;i++) out+=("00000000"+(H[i]>>>0).toString(16)).slice(-8);
  return out;
}

(function(){
  var gate=document.getElementById("gate"),
      pw=document.getElementById("gatePw"),
      btn=document.getElementById("gateBtn"),
      err=document.getElementById("gateErr"),
      box=gate.querySelector(".gatebox");

  function unlock(){
    if(sha256(pw.value.trim().toLowerCase()) === PW_HASH){
      gate.classList.add("off");
      document.body.classList.remove("locked");
      var first=document.getElementById("a_loc");
      if(first) first.focus();
    } else {
      err.textContent="Wrong password";
      box.classList.remove("shake");
      void box.offsetWidth;
      box.classList.add("shake");
      pw.select();
    }
  }
  btn.addEventListener("click", unlock);
  pw.addEventListener("keydown", function(ev){ if(ev.key==="Enter") unlock(); });
  pw.addEventListener("input", function(){ err.textContent=""; });
  pw.focus();
})();
</script>

let lang = "en";
const t = k => (L[lang] && L[lang][k] !== undefined) ? L[lang][k] : (L.da[k] !== undefined ? L.da[k] : k);
const f = (k,o) => { let s = t(k); for(const p in o) s = s.split("{"+p+"}").join(o[p]); return s; };
const locale = () => lang === "en" ? "en-GB" : "da-DK";
const pl = (base,n) => f(base + (n === 1 ? "1" : "N"), {n:kr(n)});

const $ = id => document.getElementById(id);
const num = id => { const v = parseFloat($(id).value); return isNaN(v) ? 0 : v; };
const kr  = n => Math.round(n).toLocaleString(locale());
const kr1 = n => (Math.round(n*10)/10).toLocaleString(locale(),{minimumFractionDigits:1,maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pnum = v => Math.max(0, parseFloat(String(v).replace(",", ".")) || 0);

let state = { vat:false, manualClean:false, pets:false };
const tunName = k => { const x = TUNNELS[k] || TUNNELS.none; return x.name || t(x.key); };

const KM_OVERRIDE = {};
const kmOf   = loc => KM_OVERRIDE[loc] !== undefined ? KM_OVERRIDE[loc] : (PLACE[loc] ? PLACE[loc].km : 0);
const minsOf = km  => { const s = num("s_speed") || 1; return Math.round(km / s * 60); };

/* --- rates --- */
const wage    = () => Math.max(0, num("s_wage"));
const dg      = () => Math.min(95, Math.max(MIN_DG, num("s_dg"))) / 100;   /* gross margin, never below MIN_DG */
const markup  = () => dg() / (1 - dg());                                    /* the markup that produces that gross margin */
const sellMin = () => wage() / 60 / (1 - dg());                             /* selling price per minute, before surcharges */
/* Lowest price: the standard price for the smallest size, at the same margin. */
const minFloorEx = () => STD[0].min * sellMin();

/* Final price: lift to the floor (minimum margin / minimum price), then round
   UP to the nearest DKK 50 incl. VAT, never below the minimum price.           */
function finalPrice(subtotal, cost, stairFloor){
  const dgFloor = cost / (1 - MIN_DG/100);
  const minTop  = Math.max(0, stairFloor - subtotal);
  const base    = Math.max(subtotal + minTop, dgFloor);
  const raw     = Math.round(base * VAT * 100) / 100;
  let inc       = Math.ceil(raw / 50 - 1e-9) * 50;       /* always up, so the margin never drops */
  const minIncl = Math.round(Math.round(stairFloor * VAT * 100) / 100 / 50) * 50;   /* lowest list price */
  if(inc < minIncl) inc = minIncl;
  return {minTop, total: inc / VAT, totalIncl: inc};
}
const priceOf = mins => Math.round(mins * sellMin());

function stdIndex(size){ const i = STD.findIndex(b => size <= b.max); return i < 0 ? STD.length-1 : i; }
const autoClean = size => STD[stdIndex(size)].min;
function sizeLabel(i){
  return i === 0 ? f("upTo",{x:kr(STD[0].max)})
       : STD[i].individual ? f("above",{x:kr(STD[i-1].max)})
       : f("range",{a:kr(STD[i-1].max+1), b:kr(STD[i].max)});
}

/* --- task lines: selected extra tasks plus free-text lines --- */
let ROWS = [];   /* {key|null, name, min, touched} */
const rowName = r => r.key ? t(TASK[r.key].label) : (r.name.trim() || t("exUnnamed"));

/* ==================== CALCULATION ==================== */
function calc(){
  const loc     = $("a_loc").value;
  const place   = PLACE[loc] || {km:0, tunnel:"none"};
  const size    = num("a_size");
  const km      = num("a_km");
  const kmRT    = km * 2;
  const roundT  = minsOf(kmRT);
  const toilets = Math.max(1, Math.round(num("a_toilets")) || 1);
  const extraToi= toilets - 1;
  const persons = Math.max(1, Math.round(num("a_persons")) || 1);
  const bi      = stdIndex(size);
  const individual = !!STD[bi].individual;

  const booking = $("a_booking").value;
  const isOnce  = booking === "once", isRecurring = booking === "recurring";
  const deep    = isOnce && $("a_deep").checked;
  const business= $("a_customer").value === "business";
  const visit   = deep || business;   /* an on-site visit is required before a final price */
  const freq    = $("a_freq").value;
  const weekday = $("a_weekday").value;
  const time    = $("a_time").value;
  const urgent  = $("a_urgent").checked;
  const linen   = $("a_linen").checked;

  /* work lines: minutes -> price at the base rate */
  const lines = [];
  const add = (label, mins) => { if(mins > 0) lines.push({label, min:mins, price:priceOf(mins)}); };
  const cleanMin = pnum($("a_clean").value);
  add(f("bdClean",{m:kr(cleanMin)}), cleanMin);
  if(extraToi) add(pl("bdToilet",extraToi) + ", " + kr(extraToi*num("s_mToilet")) + " min", extraToi*num("s_mToilet"));
  if(deep)     add(f("bdDeep",{m:kr(num("s_mDeep"))}), num("s_mDeep"));
  if(linen)    add(pl("bdLinen",persons) + ", " + kr(persons*num("s_mLinen")) + " min", persons*num("s_mLinen"));
  if(state.pets) add(f("bdPets",{m:kr(num("s_mPets"))}), num("s_mPets"));
  const windows = Math.max(0, Math.round(num("a_windows")));
  const winMin  = winMinutes(windows);
  if(windows) add(pl("bdWin",windows) + ", " + kr(winMin) + " min", winMin);
  ROWS.forEach(r => { const m = pnum(r.min); if(m > 0) add(esc(rowName(r)) + ", " + kr(m) + " min", m); });
  add(f("bdDrive",{m:kr(roundT)}), roundT);

  const workMin   = lines.reduce((a,l) => a + l.min, 0);
  const workPrice = lines.reduce((a,l) => a + l.price, 0);

  /* wage surcharges: evening/weekend and urgent */
  const isWeekend  = weekday === "sat" || weekday === "sun";
  const timeHour   = parseInt((time || "0:0").split(":")[0], 10) || 0;
  const isOffHours = isWeekend || timeHour >= 16;
  const upOff      = isOffHours ? Math.max(0, num("s_offhours")) : 0;
  const upUrg      = urgent     ? Math.max(0, num("s_urgent"))   : 0;
  const upOnce     = isOnce     ? Math.max(0, num("s_oneoff"))   : 0;   /* a one-off clean takes longer */
  const upPct      = upOff + upUrg + upOnce;
  const upliftPrice= Math.round(workPrice * upPct/100);

  /* tunnel toll, sold at the margin */
  const tunKey   = place.tunnel;
  const tunCost  = TUNNELS[tunKey] ? TUNNELS[tunKey].cost : 0;
  const tunPrice = Math.round(tunCost / (1 - dg()));

  const subtotal = workPrice + upliftPrice + tunPrice;

  /* cost */
  const wageCost   = workMin / 60 * wage();
  const upliftCost = wageCost * upPct/100;
  const cost       = wageCost + upliftCost + tunCost;

  /* the minimum price follows the one-off surcharge, so one-off is dearer on small homes too */
  const stairFloor = minFloorEx() * (1 + upOnce/100);
  const fp         = finalPrice(subtotal, cost, stairFloor);
  const minTop     = fp.minTop;
  const total      = fp.total;
  const rounding   = Math.abs(total - subtotal - minTop) < 0.5 ? 0 : total - subtotal - minTop;

  const profit     = total - cost;
  const mkEff      = cost > 0 ? profit / cost * 100 : 0;
  const dgEff      = total > 0 ? profit / total * 100 : 0;

  return {loc, place, size, km, kmRT, roundT, toilets, extraToi, persons, bi, individual,
          booking, isOnce, isRecurring, deep, business, visit, freq, weekday, time, urgent, linen,
          cleanMin, windows, winMin, lines, workMin, workPrice, isOffHours, upOff, upUrg, upOnce, upPct, upliftPrice,
          tunKey, tunCost, tunPrice, subtotal, minTop, stairFloor, upOnce, rounding, total,
          wageCost, upliftCost, cost, profit, mkEff, dgEff};
}

/* ==================== RENDERING ==================== */
const vatx = n => state.vat ? n*1.25 : n;

function buildRail(){
  const mk = markup();
  $("lockNote").textContent = f("lockNote",{d:kr(dg()*100)});
  $("baseNote").textContent = f("baseNote",{r:kr(sellMin()*60*VAT)});
  $("markupHint").textContent = num("s_dg") < MIN_DG ? f("dgHint",{d:MIN_DG}) : "";
  WIN.forEach(w => $("lbl_" + w.setting).textContent = f("winRange",{a:w.min, b:w.max}));
  $("rateNote").textContent = f("rateNote",{w:kr(wage()), r:kr(sellMin()*60), d:kr(dg()*100), m:kr(mk*100)});

  const up = Math.max(0, num("s_oneoff"));
  let h = '<tr class="thead"><td></td><td>' + t("thFast") + "</td><td>" + t("thOnce") + "</td></tr>";
  STD.forEach((b,i) => {
    const wp = priceOf(b.min), c0 = b.min/60*wage();
    const fast = finalPrice(wp, c0, minFloorEx()).totalIncl;
    const once = finalPrice(wp + Math.round(wp*up/100), c0*(1+up/100), minFloorEx()*(1+up/100)).totalIncl;
    h += "<tr><td>" + sizeLabel(i) + '<span class="sm">' + (b.rng ? f("stdRange",{m:kr(b.min), r:b.rng}) : f("stdMin",{m:kr(b.min)}))
       + (b.individual ? " · " + t("individual") : "") + "</span></td>"
       + '<td class="num">' + kr(fast) + "</td><td>" + kr(once) + "</td></tr>";
  });
  $("tBase").innerHTML = h;

  h = "";
  Object.keys(TUNNELS).forEach(k => {
    const c = TUNNELS[k].cost;
    h += "<tr><td>" + tunName(k) + (c ? '<span class="sm">' + f("tunCostLbl",{x:kr(c)}) + "</span>" : "")
       + "</td><td>" + kr(Math.round(c*(1+mk)) * VAT) + "</td></tr>";
  });
  $("tTunnels").innerHTML = h;
}

function buildPlaces(){
  const keep = $("a_loc").value;
  let h = "";
  PLACES.forEach(g => {
    h += '<optgroup label="' + g[0] + '">';
    g[1].forEach(p => h += '<option value="' + p[0] + '">' + p[0] + "</option>");
    h += "</optgroup>";
  });
  $("a_loc").innerHTML = h;
  $("a_loc").value = PLACE[keep] ? keep : "Tórshavn";
}

function buildRows(){
  let h = "";
  if(ROWS.length){
    h += '<div class="exhead"><span>' + t("exName") + "</span><span>" + t("exMin") + "</span><span>" + t("exPrice") + "</span><span></span></div>";
  }
  ROWS.forEach((r,i) => {
    h += '<div class="exrow" data-i="' + i + '">'
       + (r.key
          ? '<span class="exFixed">' + esc(t(TASK[r.key].label)) + "</span>"
          : '<input type="text" class="exName" value="' + esc(r.name) + '" placeholder="' + esc(t("exPh")) + '">')
       + '<input type="number" class="exMin" min="0" step="5" value="' + esc(r.min) + '" placeholder="0">'
       + '<span class="exPrice"></span>'
       + '<button type="button" class="exDel" aria-label="' + esc(t("exDel")) + '" title="' + esc(t("exDel")) + '">×</button>'
       + "</div>";
  });
  $("exRows").innerHTML = h;
}

  $("wrapDeep").classList.toggle("dim", !c.isOnce);
  $("a_deep").disabled = !c.isOnce;
  $("wrapFreq").classList.toggle("dim", !c.isRecurring);

  $("freqInfo").textContent = c.isRecurring ? "\u00a0" : t("onlyRecurring");

  $("locInfo").textContent  = f("locInfo",{kmr:kr1(c.kmRT), r:kr(c.roundT), t:tunName(c.tunKey)});
  $("kmSrc").textContent    = manualKm ? t("kmManual") : t("kmAuto");
  $("kmSrc").classList.toggle("est", manualKm);

    ? pl("winCnt",c.windows) + " · " + kr(c.winMin) + " min · " + kr(vatx(priceOf(c.winMin))) + " " + t("kr")
    : t("winNone");
  $("flagWin").textContent = t("winOver");

  $("bigLbl").textContent = state.vat ? t("priceGuideIncl") : t("priceGuideExcl");

  $("customerInfo").classList.toggle("est", c.business);

  $("flagVisit").textContent = c.visit ? f("visitNote",{what:whats.join(" " + t("andWord") + " ")}) : "";
  $("flagVisit").classList.toggle("on", c.visit);
  $("bigAmt").innerHTML   = kr(vatx(c.total)) + "<small>" + t("kr") + "</small>";
  $("bigAlt").textContent = state.vat ? f("altExcl",{x:kr(c.total)}) : f("altIncl",{x:kr(c.total*1.25)});

  const target = dg()*100;
  const cls = c.dgEff >= target - 0.5 ? "g" : c.dgEff >= target - 15 ? "y" : "r";
  $("kpis").innerHTML =
      kpi(t("kpiTime"),   kr1(c.workMin/60), t("uHours"))
    + kpi(t("kpiWage"),   kr(c.wageCost + c.upliftCost), t("kr"))
    + kpi(t("kpiMarkup"), kr(c.mkEff), "%", cls)
    + kpi(t("kpiDg"),     kr(c.dgEff), "%", cls);

  $("inclNote").textContent = t("inclNote");

  let rows = "";
  c.lines.forEach(l => rows += line(l.label, kr(vatx(l.price))));
  if(c.upPct){
    const why = [c.upOnce ? t("whyOnce") : "", c.upOff ? t("whyOff") : "", c.upUrg ? t("whyUrgent") : ""].filter(Boolean).join(" + ");
    rows += line(f("bdUplift",{why, p:kr(c.upPct)}), kr(vatx(c.upliftPrice)));
  }

  if(c.minTop)   rows += line(t("bdMin"), kr(vatx(c.minTop)));

  $("bd").innerHTML =

      + (c.upPct ? line(f("mmUplift",{p:kr(c.upPct)}), kr(c.upliftCost)) : "")
      + (c.tunCost ? line(t("mmTun"), kr(c.tunCost)) : "")

      + "</dl>"
      + '<div class="bar"><span class="cost" style="width:' + (100-dgw) + '%"></span><span class="gm" style="width:' + dgw + '%"></span></div>'
      + '<div class="leg"><span>' + t("kpiMarkup") + " <b>" + kr(c.mkEff) + " %</b></span>"
      + "<span>" + t("kpiDg") + " <b>" + kr(c.dgEff) + " %</b></span></div>"
      + "</div>";
}

const sgn = v => (v < 0 ? "−" : "") + kr(Math.abs(v));
const kpi  = (k,v,u,cls) => '<div class="kpi"><div class="k">'+k+'</div><div class="v'+(cls?" "+cls:"")+'">'
                          + v + (u ? "<small>"+u+"</small>" : "") + "</div></div>";
const line = (label,val) => "<dt>" + label + "</dt><dd>" + val + "</dd>";

/* ==================== EVENTS ==================== */
document.querySelectorAll(".panel > h2").forEach(h =>
  h.addEventListener("click", () => h.parentElement.classList.toggle("closed")));

function syncPlace(){
  $("a_km").value = kmOf($("a_loc").value);
  if(!state.manualClean) $("a_clean").value = autoClean(num("a_size"));
}

$("a_loc").addEventListener("change", () => { syncPlace(); render(); });
$("a_km").addEventListener("input", () => {
  const loc = $("a_loc").value, v = num("a_km");
  if(PLACE[loc] && v !== PLACE[loc].km) KM_OVERRIDE[loc] = v; else delete KM_OVERRIDE[loc];
  render();
});
$("a_size").addEventListener("input", () => {
  if(!state.manualClean) $("a_clean").value = autoClean(num("a_size"));
  render();
});
$("a_clean").addEventListener("input", () => {
  state.manualClean = pnum($("a_clean").value) !== autoClean(num("a_size"));
  render();
});
["a_toilets","a_persons","a_time","a_windows"].forEach(id => $(id).addEventListener("input", render));
["a_customer","a_booking","a_freq","a_weekday","a_deep","a_urgent","a_linen","a_time"].forEach(id => $(id).addEventListener("change", render));

/* standard times: changing one updates the selected tasks, unless edited for this job */
document.querySelectorAll(".rail input").forEach(el => el.addEventListener("input", () => {
  ROWS.forEach(r => { if(r.key && !r.touched) r.min = String(num(TASK[r.key].setting)); });
  if(TASKS.some(x => x.setting === el.id)){
    document.querySelectorAll("#exRows .exrow").forEach(row => {
      const r = ROWS[+row.dataset.i]; if(r && r.key && !r.touched) row.querySelector(".exMin").value = r.min;
    });
  }
  render();
}));

/* pets */
$("petsTiles").addEventListener("click", e => {
  const b = e.target.closest(".tile"); if(!b) return;
  state.pets = b.dataset.val === "yes"; render();
});

/* extra tasks: toggling a tile adds or removes a line */
$("extrasTiles").addEventListener("click", e => {
  const b = e.target.closest(".tile"); if(!b) return;
  const k = b.dataset.key, i = ROWS.findIndex(r => r.key === k);
  if(i >= 0) ROWS.splice(i, 1);
  else ROWS.push({key:k, name:"", min:String(num(TASK[k].setting)), touched:false});
  buildRows(); render();
});
$("exAdd").addEventListener("click", () => {
  ROWS.push({key:null, name:"", min:"", touched:true});
  buildRows(); render();
  const names = document.querySelectorAll("#exRows .exName");
  if(names.length) names[names.length-1].focus();
});
$("exRows").addEventListener("input", e => {
  const row = e.target.closest(".exrow"); if(!row) return;
  const r = ROWS[+row.dataset.i]; if(!r) return;
  if(e.target.classList.contains("exName")) r.name = e.target.value;
  if(e.target.classList.contains("exMin")){ r.min = e.target.value; r.touched = true; }
  render();
});
$("exRows").addEventListener("click", e => {
  if(!e.target.classList.contains("exDel")) return;
  ROWS.splice(+e.target.closest(".exrow").dataset.i, 1);
  buildRows(); render();
});

/* --- paste km from Landsverk --- */
function norm(s){ return s.toLowerCase().replace(/[.,;:]+$/,"").trim(); }
const NORM = {}; Object.keys(PLACE).forEach(k => NORM[norm(k)] = k);

$("importBtn").addEventListener("click", () => {
  const lines = $("importBox").value.split(/\r?\n/);
  let ok = 0, bad = 0;
  lines.forEach(raw => {
    const s = raw.trim(); if(!s) return;
    const m = s.match(/^(.*?)[\s\t:;=]+(-?[\d]+(?:[.,]\d+)?)\s*(?:km)?$/i);
    if(!m){ bad++; return; }
    const name = NORM[norm(m[1])];
    const km = parseFloat(m[2].replace(",", "."));
    if(name === undefined || isNaN(km)){ bad++; return; }
    if(km === PLACE[name].km) delete KM_OVERRIDE[name]; else KM_OVERRIDE[name] = km;
    ok++;
  });
  const msg = $("importMsg");
  if(ok === 0){ msg.textContent = t("importNone"); msg.classList.add("bad"); }
  else { msg.textContent = f("importOk",{n:ok}) + (bad ? " " + f("importUnknown",{n:bad}) : ""); msg.classList.remove("bad"); }
  syncPlace(); render();
});
$("resetKmBtn").addEventListener("click", () => {
  Object.keys(KM_OVERRIDE).forEach(k => delete KM_OVERRIDE[k]);
  $("importBox").value = "";
  const msg = $("importMsg"); msg.textContent = t("resetOk"); msg.classList.remove("bad");
  syncPlace(); render();
});

$("langs").addEventListener("click", e => {

});

$("copyBtn").addEventListener("click", () => {
  const c = last, K = t("kr"), out = [];
  out.push(t("cTitle"));
  if(c.business) out.push(t("optBusiness"));
  out.push(f("cSpec",{loc:c.loc, s:kr(c.size), km:kr1(c.kmRT), o:kr(c.roundT)}));
  out.push(pl("cToilet",c.toilets));
  if(c.isRecurring) out.push(f("schedRecurring",{f:t({weekly:"optWeekly",biweekly:"optBiweekly",triweekly:"optTriweekly",monthly:"optMonthly"}[c.freq] || "optWeekly"),
                             d:t("d"+c.weekday.charAt(0).toUpperCase()+c.weekday.slice(1)), t:c.time}));
  else out.push(t("schedOnce") + " · " + c.time);
  out.push("");
  c.lines.forEach(l => out.push(l.label.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"') + ": " + kr(l.price) + " " + K));
  if(c.upPct){
    const why = [c.upOnce ? t("whyOnce") : "", c.upOff ? t("whyOff") : "", c.upUrg ? t("whyUrgent") : ""].filter(Boolean).join(" + ");
    out.push(f("bdUplift",{why, p:kr(c.upPct)}) + ": " + kr(c.upliftPrice) + " " + K);
  }
  if(c.tunCost)  out.push(t("bdTunnel") + ", " + tunName(c.tunKey) + ": " + kr(c.tunPrice) + " " + K);
  if(c.minTop)   out.push(t("bdMin") + ": " + kr(c.minTop) + " " + K);
  if(c.rounding) out.push(t("bdRound") + ": " + sgn(c.rounding) + " " + K);
  out.push(t("totalExcl") + ": " + kr(c.total) + " " + K);
  out.push(t("totalIncl") + ": " + kr(c.total*1.25) + " " + K);
  out.push(t("cGuide"));
  if(c.visit){ const wl = [c.deep ? t("whatDeep") : "", c.business ? t("whatBusiness") : ""].filter(Boolean);
    out.push(f("cVisit",{what:wl.join(" " + t("andWord") + " ")})); }
  out.push("");
  out.push(f("cMargin",{mk:kr(c.mkEff), dg:kr(c.dgEff), x:kr(c.profit)}));
  navigator.clipboard?.writeText(out.join("\n")).then(
    () => flash(t("copied")), () => flash(t("copyFail")));
});
function flash(msg){
  const b = $("copyBtn");
  b.textContent = msg; b.classList.add("on");
  setTimeout(() => { b.textContent = t("copy"); b.classList.remove("on"); }, 1800);
}

const SETTINGS = ["s_wage","s_dg","s_mToilet","s_mDeep","s_mLinen","s_mPets","s_mFridge","s_mFreezer","s_mFridgeFreezer","s_mDefrost",
                  "s_mOven","s_mCabinets","s_mExtraDeep","s_w5","s_w10","s_w15","s_w20","s_w30","s_offhours","s_urgent","s_oneoff","s_speed"];
$("saveBtn").addEventListener("click", () => {
  const s = {}; SETTINGS.forEach(id => s[id] = $(id).value);
  const blob = new Blob([JSON.stringify({settings:s, km:KM_OVERRIDE, lang}, null, 2)], {type:"application/json"});
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = "klart-settings.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(u), 1000);
});
$("loadInp").addEventListener("change", e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const dd = JSON.parse(r.result);
      if(dd.settings) SETTINGS.forEach(id => { if(dd.settings[id] !== undefined) $(id).value = dd.settings[id]; });
      Object.keys(KM_OVERRIDE).forEach(k => delete KM_OVERRIDE[k]);
      if(dd.km) Object.keys(dd.km).forEach(k => { if(PLACE[k]) KM_OVERRIDE[k] = dd.km[k]; });
      if(dd.lang && L[dd.lang]) lang = dd.lang;
      ROWS.forEach(r => { if(r.key && !r.touched) r.min = String(num(TASK[r.key].setting)); });
      state.manualClean = false;
      syncPlace(); applyLang();
    }catch(err){ alert(t("loadErr")); }
  };
  r.readAsText(file); e.target.value = "";
});
